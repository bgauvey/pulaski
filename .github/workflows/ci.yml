# Builds and tests Pulaski on every push to main and every pull request.
#
# - build-and-test (Linux): the whole solution in Release (warnings are errors, code style enforced), then every test project. The
#   database tests run against a stock PostgreSQL 18 service, as a superuser that can create the throwaway database and login they use
#   (Tests/Pulaski.Infrastructure.Tests/DatabaseFixture.cs). The OPC UA server tests run against Microsoft's OPC PLC simulator, started
#   with the same settings as deploy/simulator/compose.yaml.
# - edge-windows: the edge node also ships as a Windows service, so it is built and its tests run on Windows too.
# - images: the container images in deploy/images build (D-101). They aren't published.
# - demo: docker compose up --build from a clean runner reaches a working sign-in and the simulated machines reach Pulaski, as the
#   quickstart promises.
#
# The .NET jobs install the SDK global.json pins, so CI builds with the same compiler and analyzers as a developer's machine; a newer SDK
# (with new analyzer rules, which fail the build as warnings are errors) arrives only when global.json is bumped.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  build-and-test:
    name: Build and test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PULASKI_TEST_ADMIN_CONNECTION: Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=postgres
      PULASKI_OPCUA_TEST_ENDPOINT: opc.tcp://localhost:50000

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', 'nuget.config', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # Service containers can't be given arguments, so the simulator is started here, as in deploy/simulator/compose.yaml.
      - name: Start the OPC UA simulator
        run: |
          docker run -d --name opc-plc -p 50000:50000 mcr.microsoft.com/iotedge/opc-plc:2.15.12 \
            --pn=50000 --autoaccept --unsecuretransport --sph --fn=5 --fr=1 --ft=uint --sn=5 --sr=10 --st=double
          for i in $(seq 1 60); do
            if (exec 3<>/dev/tcp/localhost/50000) 2>/dev/null; then echo "OPC UA simulator is listening"; exit 0; fi
            sleep 1
          done
          echo "::error::The OPC UA simulator didn't start"
          docker logs opc-plc
          exit 1

      - name: Restore
        run: dotnet restore src/Pulaski.slnx

      - name: Build
        run: dotnet build src/Pulaski.slnx -c Release --no-restore

      - name: Test
        run: dotnet test src/Pulaski.slnx -c Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux
          path: TestResults
          if-no-files-found: ignore

  edge-windows:
    name: Edge node (Windows)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', 'nuget.config', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build and test the edge node
        run: dotnet test Tests/Pulaski.Edge.Tests -c Release --logger trx --results-directory TestResults

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: TestResults
          if-no-files-found: ignore

  images:
    name: Image (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: [api, web, edge, db, demo-setup, process-simulator]

    steps:
      - uses: actions/checkout@v5

      - name: Build the image
        run: docker build -f deploy/images/${{ matrix.image }}/Dockerfile -t pulaski-${{ matrix.image }}:ci .

  demo:
    name: Demo (docker compose up)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Start the demo
        run: docker compose up --build -d

      # The setup uses the administrator's password for a moment, so the sign-in is checked once it has finished.
      - name: Wait for the setup, the API and the UI
        run: |
          for i in $(seq 1 120); do
            if [ "$(docker compose ps -a --format '{{.State}}' demo-setup)" = exited ]; then break; fi
            sleep 2
          done
          test "$(docker compose ps -a --format '{{.ExitCode}}' db-init)" = 0
          test "$(docker compose ps -a --format '{{.ExitCode}}' demo-setup)" = 0
          curl -fsS -X POST http://localhost:5080/api/auth/sign-in -H 'content-type: application/json' \
            -d '{"username":"admin","password":"Pulaski-demo-1"}' -o /dev/null
          curl -fsS -o /dev/null http://localhost:5090/account/login
          echo "The demo is up: the database and the edge were set up, the administrator can sign in and the UI answers."

      # Machine data end to end: simulators -> broker -> edge -> API, each machine's state mapped through the simulators' profile.
      - name: Check the machines reach Pulaski
        run: |
          query="SELECT count(*) FROM core.equipment_live_state s JOIN core.equipment e ON e.id = s.equipment_id
                 WHERE e.code IN ('EXT-01-EXT', 'EXT-01-SAW', 'PACK1') AND s.packml_state = 6"
          for i in $(seq 1 30); do
            running="$(docker compose exec -T db psql -U postgres -d pulaski -tAc "$query")"
            if [ "$running" = 3 ]; then echo "All three simulated machines are in Execute in Pulaski."; exit 0; fi
            sleep 2
          done
          echo "::error::Only $running of the three simulated machines reached Execute in Pulaski."
          exit 1

      # The process simulator's melt temperature and profile width, recorded as process values of EXT-01-EXT.
      - name: Check the process values reach Pulaski
        run: |
          query="SELECT count(DISTINCT v.equipment_tag_id) FROM ts.process_value v JOIN core.equipment_tag t ON t.id = v.equipment_tag_id
                 WHERE t.source_address LIKE 'Plant1/ExtruderProcess/EXT-01-EXT:Process/%'"
          for i in $(seq 1 30); do
            recorded="$(docker compose exec -T db psql -U postgres -d pulaski -tAc "$query")"
            if [ "$recorded" = 2 ]; then echo "Both process values are recorded in Pulaski."; exit 0; fi
            sleep 2
          done
          echo "::error::Only $recorded of the two process values reached Pulaski."
          exit 1

      - name: Show the logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the demo
        if: always()
        run: docker compose down -v
