name: pulaski-opcua
services:
  opcplc:
    container_name: pulaski.opc-plc
    image: mcr.microsoft.com/iotedge/opc-plc:latest
    ports:
      - "50000:50000"
      - "8080:8080"
    stdin_open: true
    tty: true
    command:
      - --pn=50000
      - --autoaccept
      - --sph
      - --sn=5
      - --sr=10
      - --st=uint
      - --fn=5
      - --fr=1
      - --ft=uint
      - --gn=5
