# Pulaski demo (D-101): one simulated plant, end to end.
#
#   docker compose up --build        then open http://localhost:5090 and sign in as admin / Pulaski-demo-1 (you'll choose a new password)
#   docker compose down              stops it; add -v to delete the demo database too
#
# It builds the images from this clone (deploy/images), starts PostgreSQL 18, creates the database with the demo site, lines and
# materials (pulaski-db), then the API and the UI. The machine simulators (deploy/simulator/compose.yaml: an MQTT broker, three PackML
# simulators publishing Sparkplug B, an OPC UA server) start beside them; demo-setup connects an edge node to them and starts the
# simulated machines, and the edge forwards their states to Pulaski. demo-history then records the previous shift and the current one so
# far, so the screens have something to show from the start.
#
# Every password and key below is for this demo only. Each can be overridden from the environment or a .env file beside this one, as can
# the ports, if something on this machine already uses them.
name: pulaski

include:
  - deploy/simulator/compose.yaml

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: ${PULASKI_DB_PASSWORD:-pulaski-demo-owner}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Creates or upgrades the database, then exits; the API waits for it.
  db-init:
    build:
      context: .
      dockerfile: deploy/images/db/Dockerfile
    image: pulaski-db:demo
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: ${PULASKI_DB_PASSWORD:-pulaski-demo-owner}
      PULASKI_APP_PASSWORD: ${PULASKI_APP_PASSWORD:-pulaski-demo-api}
      PULASKI_SEED: demo
    restart: "no"

  api:
    build:
      context: .
      dockerfile: deploy/images/api/Dockerfile
    image: pulaski-api:demo
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Pulaski: Host=db;Database=pulaski;Username=pulaski_api;Password=${PULASKI_APP_PASSWORD:-pulaski-demo-api}
      Security__SigningKey: ${PULASKI_SIGNING_KEY:-pulaski-demo-signing-key-not-for-production-use}
      Security__BootstrapAdmin__Username: admin
      Security__BootstrapAdmin__Password: ${PULASKI_ADMIN_PASSWORD:-Pulaski-demo-1}
    ports:
      - "${PULASKI_API_PORT:-5080}:8080"
    volumes:
      - api-keys:/home/app/.aspnet/DataProtection-Keys
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/images/web/Dockerfile
    image: pulaski-web:demo
    depends_on:
      - api
    environment:
      PulaskiApi__BaseUrl: http://api:8080/
    ports:
      - "${PULASKI_WEB_PORT:-5090}:8080"
    volumes:
      - web-keys:/home/app/.aspnet/DataProtection-Keys
    restart: unless-stopped

  # Connects an edge node to the simulators through the API and starts the simulated machines, then exits (tools/Pulaski.DemoSetup).
  # It uses the administrator's temporary password for a moment and gives it back, so the first sign-in still chooses a new one.
  demo-setup:
    build:
      context: .
      dockerfile: deploy/images/demo-setup/Dockerfile
    image: pulaski-demo-setup:demo
    depends_on:
      - api
      - broker
    environment:
      PULASKI_API_URL: http://api:8080/
      PULASKI_ADMIN_PASSWORD: ${PULASKI_ADMIN_PASSWORD:-Pulaski-demo-1}
      PULASKI_MQTT_HOST: broker
      PULASKI_MQTT_PORT: "1883"
    volumes:
      - edge-config:/shared
    restart: "no"

  # Gives the demo plant its previous shift and the current one so far (tools/Pulaski.DemoHistory): orders run, reports, lots, stops, quality
  # results and SPC alerts, andon calls, labor and handover notes, recorded through the application's own handlers. Once only; then exits.
  demo-history:
    build:
      context: .
      dockerfile: deploy/images/demo-history/Dockerfile
    image: pulaski-demo-history:demo
    depends_on:
      demo-setup:
        condition: service_completed_successfully
    environment:
      PULASKI_CONNECTION: Host=db;Database=pulaski;Username=pulaski_api;Password=${PULASKI_APP_PASSWORD:-pulaski-demo-api}
    restart: "no"

  # The edge node, signed in with what demo-setup writes; it starts as soon as that is there, so it sees the machines start. Its buffer
  # survives a new container (edge-data).
  edge:
    build:
      context: .
      dockerfile: deploy/images/edge/Dockerfile
    image: pulaski-edge:demo
    depends_on:
      - demo-setup
    entrypoint:
      - sh
      - -c
      - |
        for i in $$(seq 1 150); do [ -f /shared/edge.env ] && break; sleep 2; done
        if [ ! -f /shared/edge.env ]; then
          echo "The demo setup didn't set up an edge node (see its log), so there is nothing to run."
          exit 0
        fi
        . /shared/edge.env && exec dotnet Pulaski.Edge.dll
    volumes:
      - edge-config:/shared:ro
      - edge-data:/data
    restart: on-failure

volumes:
  db-data:
  api-keys:
  web-keys:
  edge-config:
  edge-data:
