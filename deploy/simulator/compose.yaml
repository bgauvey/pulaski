# Pulaski machine data demo (D-050): an MQTT broker and three PackML simulators publishing Sparkplug B, and an OPC UA
# server (#22).
#
#   docker compose -f deploy/simulator/compose.yaml up -d
#
# The OPC UA server (Microsoft's OPC PLC simulator) listens on opc.tcp://localhost:${PULASKI_OPCUA_PORT:-50000}. It accepts any
# client certificate and also offers security none; on the connection set trustAnyServer = true (it makes its own certificate on
# each start), or give its thumbprint. Its changing values are under ns=3, such as ns=3;s=StepUp and ns=3;s=FastUInt1.
#
# The simulators publish to group "Plant1" on the broker at localhost:${PULASKI_MQTT_PORT:-1883}. Bind their
# Sparkplug B addresses to EXT-01-EXT, EXT-01-SAW and PACK1 in Pulaski. The image is amd64; Docker Desktop
# emulates it on arm64 hosts.
name: pulaski-simulator

services:
  broker:
    image: eclipse-mosquitto:2.0.20
    ports:
      - "${PULASKI_MQTT_PORT:-1883}:1883"   # PULASKI_MQTT_PORT=1884 if another broker has 1883
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  extruder:
    image: spruiktec/packml-simulator:latest
    platform: linux/amd64
    depends_on:
      - broker
    environment:
      CLIENT_TYPE: sparkplugb
      SITE: PLT1
      AREA: EXT
      LINE: EXT-01-EXT
      MQTT_URL: mqtt://broker
      MQTT_PORT: "1883"
      SPARKPLUG_GROUP_ID: Plant1
      SPARKPLUG_EDGE_NODE: Extruder
      TICK: "1000"

  saw:
    image: spruiktec/packml-simulator:latest
    platform: linux/amd64
    depends_on:
      - broker
    environment:
      CLIENT_TYPE: sparkplugb
      SITE: PLT1
      AREA: EXT
      LINE: EXT-01-SAW
      MQTT_URL: mqtt://broker
      MQTT_PORT: "1883"
      SPARKPLUG_GROUP_ID: Plant1
      SPARKPLUG_EDGE_NODE: Saw
      TICK: "1000"

  packer:
    image: spruiktec/packml-simulator:latest
    platform: linux/amd64
    depends_on:
      - broker
    environment:
      CLIENT_TYPE: sparkplugb
      SITE: PLT1
      AREA: PKG
      LINE: PACK1
      MQTT_URL: mqtt://broker
      MQTT_PORT: "1883"
      SPARKPLUG_GROUP_ID: Plant1
      SPARKPLUG_EDGE_NODE: Packer
      TICK: "1000"

  opcua:
    image: mcr.microsoft.com/iotedge/opc-plc:2.15.12
    command: ["--pn=50000", "--autoaccept", "--unsecuretransport", "--sph", "--fn=5", "--fr=1", "--ft=uint", "--sn=5", "--sr=10", "--st=double"]
    ports:
      - "${PULASKI_OPCUA_PORT:-50000}:50000"
